<script>
(()=>{

const I=(name)=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.info}</svg>`;
const routes=[
['05:30','01','Centro via Alto','Ida'],['05:40','02','Tijuqueiro','Ida'],['06:00','03','Centro via Copa / Nem Expresso','Ida'],['06:00','13','Circular Metrô / Oceânico','Circular'],['06:05','04','Centro via Alto Expresso','Ida'],['06:10','05','Centro via Jardim Botânico Expresso','Ida'],['06:20','09','Jardim Oceânico / Barrinha','Ida'],['06:20','12','Alfa Barra / Rosas / Leblon','Ida'],['06:25','10','Novo Leblon / Pista Interna','Ida'],['06:30','01','Barra via Alto','Volta'],['06:30','06','Centro Copacabana Expresso','Ida'],['06:40','02','Tijuqueiro','Volta'],['09:30','04','Circular Shopping','Circular'],['12:00','04','Centro via Copacabana','Ida']
].map((r,i)=>({time:r[0],id:r[1],name:r[2],direction:r[3],key:i}));
const tracked=routes[routes.length-1];
const stops=[{name:'Leme',x:29,y:23},{name:'Praça do Lido',x:40,y:35},{name:'Copacabana Palace',x:52,y:45},{name:'Siqueira Campos',x:61,y:59},{name:'Cantagalo',x:71,y:70},{name:'Posto 5',x:81,y:78}];
const state={tab:'home',filter:'Todas',search:'',sheet:null,favorite:readFavorites(),selectedStop:1,progress:.4,zoom:1,panX:0,panY:0,paused:false};
function readFavorites(){try{let f=JSON.parse(localStorage.getItem('via-v02-fav')||'[]');return Array.isArray(f)?f:[]}catch{return []}}
function favSave(){try{localStorage.setItem('via-v02-fav',JSON.stringify(state.favorite))}catch{}}
const $=(q)=>document.querySelector(q);
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function header(){return `<header class="app-head"><div class="brand">via<em>.</em></div><button class="round-btn" data-action="info" aria-label="Sobre o protótipo">${I('info')}</button></header>`}
function home(){let f=routes.filter(r=>state.favorite.includes(r.key));return `<div class="view-home">${header()}<div class="greeting">SEU TRANSPORTE</div><h1 class="headline">Para onde<br>vamos hoje?</h1><button class="search-field" data-tab="routes" data-focus="1">${I('search')} <span>Buscar uma linha ou destino</span></button><div class="section-head"><span class="section-title">Acompanhe seu ônibus</span><span class="section-hint">Exemplo</span></div><section class="hero-card"><div class="hero-top"><span class="line-pill">LINHA 04</span><span class="demo-outline">● GPS simulado</span></div><h2>Centro via<br>Copacabana</h2><div class="departure">${I('clock')} Saída exibida: <b>12:00</b></div><button class="primary-cta" data-tab="map"><span>Ver ônibus no mapa</span><span class="cta-circle">${I('arrow')}</span></button></section><div class="quick"><button class="quick-btn" data-tab="routes">${I('clock')}<span>Ver horários</span></button><button class="quick-btn" data-tab="map">${I('map')}<span>Explorar mapa</span></button></div>${f.length?`<div class="section-head"><span class="section-title">Salvos</span><button data-tab="routes" data-filter="Salvas" style="border:0;background:none;color:#0c7b67;font-size:12px;font-weight:750">Ver todos</button></div>${f.slice(0,2).map(r=>`<button class="home-favorite" data-route="${r.key}">${I('star')}<b>${esc(r.name)}</b><small>${r.time}</small>${I('chev')}</button>`).join('')}`:''}<p class="fineprint">Protótipo independente. Horários da gravação e rastreamento ilustrativo, sem conexão com o sistema real.</p></div>`}
function getFiltered(){let q=state.search.trim().toLocaleLowerCase('pt-BR');return routes.filter(r=>(state.filter==='Todas'||(state.filter==='Salvas'?state.favorite.includes(r.key):r.direction===state.filter))&&(!q||`${r.time} ${r.name} ${r.id} ${r.direction}`.toLocaleLowerCase('pt-BR').includes(q)))}
function routeItem(r){return `<button class="route-item" data-route="${r.key}"><span class="time-block"><b>${r.time}</b><small>LINHA ${r.id}</small></span><span class="route-desc"><b>${esc(r.name)}</b><small>${r.direction}${state.favorite.includes(r.key)?' · ★ Salva':''}</small></span><span class="chevron">${I('chev')}</span></button>`}
function routeResults(){let a=getFiltered();return `<div class="list-label">${a.length} ${a.length===1?'viagem':'viagens'} da gravação · horários de exemplo</div><div class="route-list">${a.length?a.map(routeItem).join(''):'<div class="empty">Nenhuma linha encontrada.<br>Tente outro nome ou horário.</div>'}</div>`}
function routesView(){return `<div class="view-routes"><div class="screen-head"><div><h1>Horários</h1><small>Encontre sua linha rapidamente</small></div><button class="round-btn" data-action="info" aria-label="Sobre os horários">${I('info')}</button></div><label class="list-search">${I('search')}<input id="route-search" type="search" autocomplete="off" placeholder="Linha, destino ou horário" value="${esc(state.search)}" aria-label="Pesquisar rotas"></label><div class="filter-strip">${['Todas','Ida','Volta','Circular','Salvas'].map(f=>`<button class="chip ${state.filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><div id="route-results">${routeResults()}</div></div>`}
function busPoint(t){let sections=stops.length-1,p=Math.max(0,Math.min(sections,t*sections)),i=Math.min(sections-1,Math.floor(p)),u=p-i;return {x:stops[i].x+(stops[i+1].x-stops[i].x)*u,y:stops[i].y+(stops[i+1].y-stops[i].y)*u}}

function mapSvg(){return `<svg class="map-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa esquemático ilustrativo da região de Copacabana, Rio de Janeiro"><defs><pattern id="gridroads" width="108" height="102" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><path d="M0 0H108 M0 0V102" stroke="#cbd8d3" stroke-width="13"/><path d="M0 0H108 M0 0V102" stroke="#fff" stroke-width="8"/><path d="M54 0V102 M0 51H108" stroke="#d6e1db" stroke-width="7"/><path d="M54 0V102 M0 51H108" stroke="#fff" stroke-width="4"/></pattern><linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b5e1dc"/><stop offset="1" stop-color="#8bcfc8"/></linearGradient><filter id="roadshadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".05"/></filter></defs><rect width="1000" height="1000" fill="#e8ede4"/><path d="M0 0H1000V1000H0Z" fill="url(#gridroads)" opacity=".93"/><path d="M0 0H350Q420 110 376 189Q349 267 275 313L0 326Z" fill="#bedbbd" opacity=".95"/><path d="M0 0H250Q314 81 274 165Q246 229 172 260L0 271Z" fill="#afd0af" opacity=".6"/><path d="M783 -30Q750 108 778 230Q789 380 850 477Q907 570 955 671L1040 735V-30Z" fill="#b1d0ae" opacity=".76"/><path d="M-80 950C120 801 311 774 510 813Q682 845 750 690Q799 585 898 595Q956 599 1100 661L1100 1100H-80Z" fill="#f3e9c9"/><path d="M-80 974C120 829 306 801 506 845Q690 881 781 709Q817 643 902 623Q971 617 1100 693L1100 1100H-80Z" fill="url(#water)"/><path d="M-60 919C132 787 302 762 507 809Q677 833 746 682Q793 587 897 588Q958 590 1060 638" fill="none" stroke="#faf6e7" stroke-width="27" opacity=".9"/><path d="M-70 906C128 775 297 746 507 794Q664 815 735 667Q791 572 900 572Q962 573 1060 620" fill="none" stroke="#c4d4c9" stroke-width="20"/><path d="M-70 906C128 775 297 746 507 794Q664 815 735 667Q791 572 900 572Q962 573 1060 620" fill="none" stroke="#fff" stroke-width="11"/><path d="M82 370Q246 418 386 512T728 658" stroke="#d3ded8" stroke-width="25" fill="none"/><path d="M82 370Q246 418 386 512T728 658" stroke="#fff" stroke-width="16" fill="none"/><path d="M198 110Q288 285 405 344T662 555" stroke="#d2ded8" stroke-width="23" fill="none"/><path d="M198 110Q288 285 405 344T662 555" stroke="#fff" stroke-width="14" fill="none"/><path d="M380 235Q464 344 620 395T895 522" stroke="#d4e0da" stroke-width="21" fill="none"/><path d="M380 235Q464 344 620 395T895 522" stroke="#fff" stroke-width="13" fill="none"/><g opacity=".52" fill="#a4c7ab"><ellipse cx="155" cy="225" rx="71" ry="49"/><ellipse cx="864" cy="246" rx="52" ry="67"/></g><path id="demo-route-svg" d="M 290 230 C 340 290 350 310 400 350 S 480 410 520 450 S 580 540 610 590 S 670 670 710 700 S 770 750 810 780" fill="none" stroke="#fff" stroke-width="19" stroke-linecap="round" filter="url(#roadshadow)"/><path d="M 290 230 C 340 290 350 310 400 350 S 480 410 520 450 S 580 540 610 590 S 670 670 710 700 S 770 750 810 780" fill="none" stroke="#08a391" stroke-width="11" stroke-linecap="round" stroke-dasharray="4 0"/><path id="demo-passed-svg" d="M 290 230 C 340 290 350 310 400 350 S 480 410 520 450 S 580 540 610 590 S 670 670 710 700 S 770 750 810 780" fill="none" stroke="#005a54" stroke-width="11" stroke-linecap="round" stroke-dasharray="0 9999"/></svg>`}
 
function mapView(){const p=busPoint(state.progress),s=stops[state.selectedStop];return `<div class="view-map"><div class="map-canvas"><div id="map-world" style="position:absolute;inset:0;transform:translate(${state.panX}px,${state.panY}px) scale(${state.zoom});transform-origin:50% 50%;transition:transform .18s"><div class="map-art">${mapSvg()}</div><span class="map-label le">LEME</span><span class="map-label co">COPACABANA</span><span class="map-label beach">PRAIA DE COPACABANA</span>${stops.map((st,i)=>`<button class="stop ${state.selectedStop===i?'selected':''}" data-stop="${i}" style="--x:${st.x}%;--y:${st.y}%" aria-label="Ponto ilustrativo: ${esc(st.name)}" title="${esc(st.name)}"></button>`).join('')}<div id="bus-marker" class="bus-marker" style="left:${p.x}%;top:${p.y}%" aria-label="Posição simulada do ônibus">${I('bus')}</div></div></div><div class="map-head"><span class="map-head-icon">${I('bus')}</span><span class="map-head-info"><b>Centro via Copacabana</b><small>Linha 04 · 12:00</small></span><span class="demo-tag">DEMO</span></div><div class="map-controls"><button data-action="zoom-in" aria-label="Aumentar mapa">${I('plus')}</button><button data-action="zoom-out" aria-label="Diminuir mapa">${I('minus')}</button><button data-action="zoom-reset" aria-label="Redefinir zoom">${I('target')}</button></div><div class="map-sheet"><div class="grabber"></div><div class="map-sheet-top"><div><div class="map-sheet-kicker">LINHA 04 · LOCALIZAÇÃO SIMULADA</div><h2>Seu ônibus no mapa</h2><div class="map-sheet-desc">Veículo 3210 · partida exibida 12:00</div></div><button class="mini-icon" data-action="pause" aria-label="${state.paused?'Retomar':'Pausar'} simulação">${I(state.paused?'arrow':'bus')}</button></div><div class="map-stops"><span class="dot-line"></span><p>Ponto selecionado: <strong id="selected-stop">${esc(s.name)}</strong></p>${I('chev')}</div><p class="map-sheet-footer">Mapa, paradas e movimento ilustrativos. A localização real depende de integração autorizada com o GPS existente.</p></div></div>`}
function nav(){return [['home','home','Início'],['routes','clock','Horários'],['map','map','Mapa']].map(([tab,icon,label])=>`<button class="tab ${state.tab===tab?'active':''}" data-tab="${tab}" ${state.tab===tab?'aria-current="page"':''}>${I(icon)}<span>${label}</span></button>`).join('')}
function sheet(){if(!state.sheet)return '';if(state.sheet==='info')return `<div class="sheet-backdrop" data-dismiss="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="Sobre o protótipo"><div class="sheet-handle"></div><div class="sheet-bar"><span class="sheet-kicker">SOBRE A VIA</span><button class="sheet-close" data-action="close" aria-label="Fechar">${I('close')}</button></div><h2>Simples para quem usa.</h2><p class="sheet-sub">Esta é uma proposta independente de aplicativo para transporte da associação. Os horários exibidos foram retirados da gravação do sistema anterior. O mapa é ilustrativo e a posição do ônibus é simulada.</p><button class="sheet-primary" style="width:100%;margin-top:22px" data-action="close">Entendi</button></div></div>`;let r=state.sheet,f=state.favorite.includes(r.key);return `<div class="sheet-backdrop" data-dismiss="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="Detalhes da linha"><div class="sheet-handle"></div><div class="sheet-bar"><span class="sheet-kicker">LINHA ${r.id} · ${esc(r.direction).toUpperCase()}</span><button class="sheet-close" data-action="close" aria-label="Fechar">${I('close')}</button></div><h2>${esc(r.name)}</h2><p class="sheet-sub">Horário de referência da gravação</p><div class="sheet-summary"><span>Partida exibida</span><b>${r.time}</b></div><div class="sheet-actions"><button class="sheet-primary" ${r.key!==tracked.key?'disabled title="GPS disponível apenas na linha 04 desta demonstração"':''} data-action="track">${r.key===tracked.key?'Acompanhar no mapa':'GPS não demonstrado'}</button><button class="sheet-favorite ${f?'is-on':''}" data-favorite="${r.key}" aria-label="${f?'Remover dos salvos':'Salvar linha'}">${I('star')}</button></div><p class="sheet-note">${r.key===tracked.key?'O mapa é uma simulação, sem acesso ao GPS real.':'O rastreamento desta linha não está incluído na demonstração.'}</p></div></div>`}
function render(){const v=$('#view');v.className=`view view-${state.tab}`;v.innerHTML=state.tab==='home'?home():state.tab==='routes'?routesView():mapView();$('#nav').innerHTML=nav();$('#overlay').innerHTML=sheet()}
function changeTab(tab,filter=null){if(!['home','routes','map'].includes(tab))return;state.tab=tab;state.sheet=null;if(filter)state.filter=filter;render();$('#view').scrollTop=0}
function toast(msg){$('.toast')?.remove();const x=document.createElement('div');x.className='toast';x.textContent=msg;$('#app').appendChild(x);setTimeout(()=>x.remove(),2300)}
function act(action){if(action==='info'){state.sheet='info';render();return}if(action==='close'){state.sheet=null;render();return}if(action==='track'){const r=state.sheet;if(r&&r.key===tracked.key){changeTab('map')}return}if(action==='pause'){state.paused=!state.paused;render();toast(state.paused?'Simulação pausada':'Simulação retomada');return}if(action.startsWith('zoom-')){state.zoom=action==='zoom-in'?Math.min(1.8,state.zoom+.2):action==='zoom-out'?Math.max(1,state.zoom-.2):1;if(action==='zoom-reset'){state.panX=0;state.panY=0}setMapTransform()}}
function setMapTransform(){let el=$('#map-world');if(el)el.style.transform=`translate(${state.panX}px,${state.panY}px) scale(${state.zoom})`}
let dragging=null;
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.map-canvas');if(!c||e.target.closest('button'))return;dragging={id:e.pointerId,x:e.clientX,y:e.clientY,px:state.panX,py:state.panY};try{c.setPointerCapture(e.pointerId)}catch{}});
document.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==dragging.id)return;state.panX=Math.max(-260,Math.min(260,dragging.px+e.clientX-dragging.x));state.panY=Math.max(-270,Math.min(270,dragging.py+e.clientY-dragging.y));setMapTransform()});
document.addEventListener('pointerup',()=>dragging=null);document.addEventListener('pointercancel',()=>dragging=null);
$('#app').addEventListener('click',e=>{let x=e.target.closest('[data-tab]');if(x){changeTab(x.dataset.tab,x.dataset.filter||null);if(x.dataset.focus)requestAnimationFrame(()=>$('#route-search')?.focus());return}x=e.target.closest('[data-filter]');if(x){state.filter=x.dataset.filter;render();return}x=e.target.closest('[data-route]');if(x){state.sheet=routes[Number(x.dataset.route)];render();return}x=e.target.closest('[data-favorite]');if(x){let key=Number(x.dataset.favorite);state.favorite=state.favorite.includes(key)?state.favorite.filter(v=>v!==key):[...state.favorite,key];favSave();render();toast(state.favorite.includes(key)?'Linha salva':'Linha removida');return}x=e.target.closest('[data-stop]');if(x){state.selectedStop=Number(x.dataset.stop);$('.stop.selected')?.classList.remove('selected');x.classList.add('selected');$('#selected-stop').textContent=stops[state.selectedStop].name;return}x=e.target.closest('[data-action]');if(x){act(x.dataset.action);return}if(e.target.dataset.dismiss){state.sheet=null;render();return}});
$('#app').addEventListener('input',e=>{if(e.target.id==='route-search'){state.search=e.target.value;$('#route-results').innerHTML=routeResults()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sheet){state.sheet=null;render()}});
let last=0;function frame(ts){if(!last)last=ts;const dt=Math.min(100,ts-last);last=ts;if(!state.paused){state.progress=(state.progress+dt*.000008)%1;if(state.tab==='map'){const p=busPoint(state.progress),el=$('#bus-marker');if(el){el.style.left=p.x+'%';el.style.top=p.y+'%'};}}requestAnimationFrame(frame)}
render();requestAnimationFrame(frame);
if('serviceWorker'in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script></body></html>
